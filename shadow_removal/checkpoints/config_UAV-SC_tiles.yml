MODE: 2             # 1: train, 2: test, 3: eval
NMS: 1              # 0: no non-max-suppression, 1: applies non-max-suppression on the external edges by multiplying by Canny
SEED: 3407          # random seed

DEBUG: 0            # turns on debugging mode
VERBOSE: 0          # turns on verbose mode in the output console

# train
TRAIN_SHADOW_FLIST: ./shadow_removal/data/UAV-SC/train_shaded.txt
TRAIN_MASK_FLIST: ./shadow_removal/data/UAV-SC/train_mask.txt
TRAIN_GT_FLIST: ./shadow_removal/data/UAV-SC/train_unshaded.txt

# test
TEST_SHADOW_FLIST: ./shadow_removal/data/test_tiles_shaded.txt
TEST_MASK_FLIST: ./shadow_removal/data/test_tiles_mask.txt
TEST_MASK2_FLIST: ./shadow_removal/data/test_tiles_mask.txt
TEST_GT_FLIST: ./shadow_removal/data/test_tiles_unshaded.txt

# val
VAL_SHADOW_FLIST: ./shadow_removal/data/test_tiles_shaded.txt
VAL_MASK_FLIST: ./shadow_removal/data/test_tiles_mask.txt
VAL_MASK2_FLIST: ./shadow_removal/data/test_tiles_mask.txt
VAL_GT_FLIST: ./shadow_removal/data/test_tiles_unshaded.txt


LR: 0.00005                   # learning rate
D2G_LR: 0.1                   # discriminator/generator learning rate ratio
BETA1: 0.0                    # adam optimizer beta1
BETA2: 0.9                    # adam optimizer beta2

INPUT_SIZE: 1024               # input image size for training 0 for original size
SIGMA: 2                      # standard deviation of the Gaussian filter used in Canny edge detector (0: random, -1: no edge)
MAX_ITERS: 800000             # maximum number of iterations to train the model, default: 2e8

EDGE_THRESHOLD: 0.5           # edge detection threshold
L1_LOSS_WEIGHT: 1             # l1 loss weight
FM_LOSS_WEIGHT: 10            # feature-matching loss weight
STYLE_LOSS_WEIGHT: 250        # style loss weight
CONTENT_LOSS_WEIGHT: 0.1      # perceptual loss weight
INPAINT_ADV_LOSS_WEIGHT: 0.1  # adversarial loss weight

GAN_LOSS: nsgan               # nsgan | lsgan | hinge
GAN_POOL_SIZE: 0              # fake images pool size


SAMPLE_INTERVAL: 10           # how many iterations to wait before sampling (0: never)
SAMPLE_SIZE: 5                # number of images to sample
LOG_INTERVAL: 100000          # how many iterations to wait before logging training status (0: never)


MASK_REVERSE: 0               # 1 reverse dunhuang, 0 no
MASK_THRESHOLD: 0             # 100 dunhuang


GPU: [1]                      # list of gpu ids
BATCH_SIZE: 1                 # input batch size for training
TRAIN_PORTION: 0.1            # portion of training set to use, 1.0 represents all training images

SAVE_INTERVAL: 1000           # how many iterations to save model (0: never)
EVAL_INTERVAL: 5000000        # how many iterations to evaluate model (0: never) big value to disable also

TRAIN_SAMPLE_INTERVAL: 1000
EVAL_SAMPLE_INTERVAL: 20


TRAIN_SAMPLE_SAVE: ./shadow_removal/result/UAV-SC/train
EVAL_SAMPLE_SAVE: ./shadow_removal/result/UAV-SC/eval
TEST_SAMPLE_SAVE: ./shadow_removal/result/UAV-SC/test


MODEL_LOAD: FuseDiff_gen_latest.pth


DIFF_ENABLE: True
DIFF_FREEZE_COARSE: 1
DIFF_LR: 0.0001
DIFF_TRAIN_STEPS: 50 
DIFF_INFER_STEPS: 8 
DIFF_BETA_START: 0.0001
DIFF_BETA_END: 0.02
DIFF_DDIM_ETA: 0.0
DIFF_TIME_EMB_DIM: 256
DIFF_BASE_CH: 64
DIFF_L2_WEIGHT: 1.0    
DIFF_LPIPS_WEIGHT: 0.5 


AFN_TIME_COND_ENABLE: True
AFN_TIME_STEPS: 50
AFN_TIME_EMB_DIM: 128
AFN_INFER_T: 50 
